name: Scrape Duty-Free Data

on:
  schedule:
    - cron: '0 1 17 * *'
    - cron: '0 2 17 * *'
    - cron: '0 12 17 * *'
    - cron: '0 13 17 * *'
    - cron: '0 1 18 * *'
    - cron: '0 2 18 * *'
    - cron: '0 12 18 * *'
    - cron: '0 13 18 * *'
    - cron: '0 1 19 * *'
    - cron: '0 2 19 * *'
    - cron: '0 12 19 * *'
    - cron: '0 13 19 * *'
    - cron: '0 1 20 * *'
    - cron: '0 2 20 * *'
    - cron: '0 12 20 * *'
    - cron: '0 13 20 * *'
    - cron: '0 1 21 * *'
    - cron: '0 2 21 * *'
    - cron: '0 12 21 * *'
    - cron: '0 13 21 * *'
  workflow_dispatch:
    inputs:
      month:
        description: '指定月份 (如 2026-02)，留空则抓取所有缺失月份'
        required: false
        type: string
      force:
        description: '强制重新抓取'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # nodriver 需要的系统库
          # Ubuntu 24.04+: libasound2 renamed to libasound2t64
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 2>/dev/null || \
          sudo apt-get install -y -qq xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2

      - name: Run scraper
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.month }}" ]; then
            ARGS="--month ${{ github.event.inputs.month }}"
          elif [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          xvfb-run --auto-servernum python3 scrape.py $ARGS

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: auto-update $(date +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
